spring:
  datasource:
    url: jdbc:h2:mem:healthmate_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
  sql:
    init:
      mode: never

security:
  login-rate-limit:
    ip-limit: 1000
    account-limit: 100
  jwt:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    expiration-ms: 86400000

app:
  cors:
    allowed-origins:
      - http://localhost:3000

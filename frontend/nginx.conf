map $uri $response_cache_control {
    default "no-cache";
    ~^/api/ "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}
resolver 127.0.0.11 valid=10s ipv6=off;
include /etc/nginx/healthmate-edge.conf;
upstream healthmate_api {
    zone healthmate_api 64k;
    server backend:8080 resolve;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;

    add_header Cache-Control $response_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz { access_log off; default_type application/json; return 200 '{"status":"UP"}'; }
    location = /readyz {
        proxy_pass http://healthmate_api/actuator/health/readiness;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location ^~ /actuator/ { return 404; }
    location ^~ /api/ {
        proxy_pass http://healthmate_api;
        proxy_set_header Host $http_host;
        # Do not trust incoming client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $healthmate_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header X-Powered-By;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
